<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B4EA2">
<title>ZimSkills</title>
<meta name="description" content="Find skilled people and work across Zimbabwe.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B4EA2'/%3E%3Cpath d='M8 9h16L10 23h14' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top"><a class="brand" href="#/">ZimSkills</a><span><button id="install" class="link" hidden>Install app</button> <button id="out" class="link" hidden>Sign out</button></span></header>
<nav id="nav" aria-label="Main" hidden></nav>
<main id="view" tabindex="-1"><p class="muted pad">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
<script>
let ip;const b=document.getElementById("install");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;b.hidden=false});
b.onclick=async()=>{ip.prompt();await ip.userChoice;ip=null;b.hidden=true};
addEventListener("appinstalled",()=>{b.hidden=true});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
